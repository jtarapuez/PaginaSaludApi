# =============================================================================
# SonarQube - PaginaSalud (Angular 19 / TypeScript / Karma-Jasmine)
# Manual IESS MAN-001 §5.2 — adaptado de Vitest a Karma
# =============================================================================
# Antes de sonar-scanner en local:
#   npm run test:coverage
# Genera coverage/pagina-salud/lcov.info
# Token: export SONAR_TOKEN=<token>  (nunca hardcodear)
# =============================================================================

# --- Identificación del proyecto ---
sonar.projectName=PaginaSalud
sonar.projectKey=pagina-salud
sonar.projectVersion=1.0.0

# --- Conexión al SonarQube Institucional ---
sonar.host.url=http://192.168.111.89:9000

# --- Fuentes (tests co-localizados en src/**/*.spec.ts) ---
sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.angular/**,\
  **/*.config.*,\
  **/src/assets/**,\
  **/src/main.server.ts,\
  **/src/server.ts

sonar.test.inclusions=\
  **/*.spec.ts

# --- Cobertura Karma → lcov ---
sonar.typescript.lcov.reportPaths=coverage/pagina-salud/lcov.info
sonar.javascript.lcov.reportPaths=coverage/pagina-salud/lcov.info

# --- Duplicaciones: no penalizar tests ---
sonar.cpd.exclusions=\
  **/*.spec.ts

# --- Cobertura: excluir config, modelos y mapa Leaflet (validación manual/e2e) ---
sonar.coverage.exclusions=\
  **/environments/**,\
  **/models/**,\
  **/mapa-ubicaciones/mapa-ubicaciones.component.ts

# --- SCM ---
sonar.scm.disabled=true
